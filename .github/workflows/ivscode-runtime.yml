name: iVSCode Runtime

on:
  workflow_dispatch:
  push:
    branches:
      - ios-port
    paths:
      - '.github/workflows/ivscode-runtime.yml'
      - '.nvmrc'
      - 'build/**'
      - 'extensions/**'
      - 'ios/**'
      - 'package.json'
      - 'package-lock.json'
      - 'product.json'
      - 'remote/**'
      - 'resources/server/**'
      - 'src/**'

permissions:
  contents: read

concurrency:
  group: ivscode-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify pinned runtime contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Check out iVSCode
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Select repository Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Verify the manifest
        run: node ios/Runtime/scripts/verify-manifest.mjs

      - name: Parse every runtime shell entry point
        shell: bash
        run: |
          set -euo pipefail
          bash -n ios/Runtime/scripts/build-utm-engine.sh
          bash -n ios/Runtime/scripts/collect-framework-closure.sh
          bash -n ios/Runtime/scripts/rebuild-alpine-remote-dependencies.sh
          bash -n ios/Runtime/scripts/build-guest-image.sh
          bash -n ios/Runtime/guest/etc/init.d/ivscode
          bash -n ios/Runtime/guest/usr/local/sbin/ivscode-poweroff
          bash -n ios/scripts/embed-runtime-frameworks.sh
          bash -n ios/scripts/generate-app-icon.sh
          bash -n ios/scripts/stage-runtime.sh

  web:
    name: Production web workbench for the full app
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 180

    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.build/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.build/playwright
      TMPDIR: ${{ github.workspace }}/.build/tmp/
      XDG_CACHE_HOME: ${{ github.workspace }}/.build/xdg-cache
      VSCODE_SKIP_BUILD_TSGO: '1'
      VSCODE_SERIALIZE_BUILD_MANGLE: '1'
      VSCODE_MANGLE_WORKERS: '1'

    steps:
      - name: Check out iVSCode
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Keep all mutable build state in the workspace
        run: mkdir -p "$NPM_CONFIG_CACHE" "$PLAYWRIGHT_BROWSERS_PATH" "$TMPDIR" "$XDG_CACHE_HOME" ios/.build

      - name: Select repository Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install the Linux native build requirements
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            libkrb5-dev \
            libnotify-bin \
            libx11-dev \
            libx11-xcb-dev \
            libxkbfile-dev \
            pkg-config

      - name: Install repository dependencies
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: npm ci

      - name: Type-check with native TypeScript
        timeout-minutes: 15
        run: >-
          node --max-old-space-size=8192
          node_modules/@typescript/native/bin/tsc
          --project src/tsconfig.json
          --pretty false
          --noEmit

      - name: Compile the mangled production workbench
        timeout-minutes: 120
        run: npm run gulp compile-build-with-mangling

      - name: Package the minimized browser workbench
        timeout-minutes: 30
        run: npm run gulp vscode-web-min-ci

      - name: Stage and verify the workbench
        shell: bash
        run: |
          set -euo pipefail
          node ios/scripts/package-workbench.mjs --source ../vscode-web
          workbench='ios/iVSCode/Generated/Workbench'
          test -f "$workbench/index.html"
          test -f "$workbench/ivscode.bootstrap.js"
          test -f "$workbench/out/nls.messages.js"
          test -f "$workbench/out/vs/workbench/workbench.web.main.internal.js"
          test -f "$workbench/out/vs/workbench/workbench.web.main.internal.css"
          test -d "$workbench/extensions/code-mobile"
          test -f "$workbench/ivscode-build.json"
          tar -cf ios/.build/iVSCode-Workbench.tar -C "$workbench" .

      - name: Upload the workbench
        uses: actions/upload-artifact@v4
        with:
          name: ivscode-full-workbench-${{ github.sha }}
          path: ios/.build/iVSCode-Workbench.tar
          if-no-files-found: error
          retention-days: 1

  engine:
    name: No-JIT iOS QEMU engine
    needs: verify
    runs-on: macos-15
    timeout-minutes: 360

    env:
      TMPDIR: ${{ github.workspace }}/.build/tmp/
      XDG_CACHE_HOME: ${{ github.workspace }}/.build/xdg-cache
      UTM_COMMIT: 048ca7498ea3a374439149d51739d94c5300bcda

    steps:
      - name: Check out iVSCode
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Keep all mutable build state in the workspace
        run: mkdir -p "$TMPDIR" "$XDG_CACHE_HOME" .build/runtime

      - name: Restore a verified engine closure
        id: engine-cache
        uses: actions/cache@v4
        with:
          path: .build/runtime/engine
          key: ivscode-engine-${{ runner.os }}-${{ runner.arch }}-${{ env.UTM_COMMIT }}-${{ hashFiles('ios/Runtime/manifest.json', 'ios/Runtime/scripts/build-utm-engine.sh', 'ios/Runtime/scripts/collect-framework-closure.sh') }}

      - name: Check out pinned UTM recursively
        if: steps.engine-cache.outputs.cache-hit != 'true'
        uses: actions/checkout@v4
        with:
          repository: utmapp/UTM
          ref: 048ca7498ea3a374439149d51739d94c5300bcda
          path: .build/UTM
          fetch-depth: 1
          submodules: recursive

      - name: Select UTM's Apple toolchain
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(xcode-select -p)" == /Applications/Xcode_26.0.app* ]] || \
            sudo xcode-select -s /Applications/Xcode_26.0.app
          xcodebuild -version

      - name: Install UTM's hosted build requirements
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          brew uninstall cmake
          brew install bison pkg-config gettext glib-utils libgpg-error nasm make meson
          python3 -m venv "$GITHUB_WORKSPACE/.build/utm-python"
          "$GITHUB_WORKSPACE/.build/utm-python/bin/python" -m pip install \
            setuptools six pyparsing distlib mako pyyaml
          rm -f /usr/local/lib/pkgconfig/*.pc
          echo "$GITHUB_WORKSPACE/.build/utm-python/bin" >> "$GITHUB_PATH"
          echo '/usr/local/opt/bison/bin' >> "$GITHUB_PATH"
          echo '/opt/homebrew/opt/bison/bin' >> "$GITHUB_PATH"

      - name: Build the interpreter-only ARM64 engine
        if: steps.engine-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          bash ios/Runtime/scripts/build-utm-engine.sh "$GITHUB_WORKSPACE/.build/UTM"
          bash ios/Runtime/scripts/collect-framework-closure.sh \
            "$GITHUB_WORKSPACE/.build/UTM/sysroot-iOS-TCI-arm64" \
            "$GITHUB_WORKSPACE/.build/runtime/engine"

      - name: Verify the engine artifact
        shell: bash
        run: |
          set -euo pipefail
          qemu='.build/runtime/engine/Frameworks/qemu-aarch64-softmmu.framework/qemu-aarch64-softmmu'
          test -f "$qemu"
          test -x "$qemu"
          test -f .build/runtime/engine/frameworks.txt
          test -f .build/runtime/engine/SHA256SUMS
          (
            cd .build/runtime/engine
            shasum -a 256 --check SHA256SUMS
          )
          tar -czf .build/runtime/ivscode-qemu-ios-tci-arm64.tar.gz \
            -C .build/runtime/engine .
          tar -tzf .build/runtime/ivscode-qemu-ios-tci-arm64.tar.gz >/dev/null
          du -sh .build/runtime/engine

      - name: Upload the no-JIT engine
        uses: actions/upload-artifact@v4
        with:
          name: ivscode-qemu-ios-tci-arm64-${{ github.sha }}
          # upload-artifact normalizes file modes. The tar transport preserves
          # the executable bits required by iOS's dynamic loader.
          path: .build/runtime/ivscode-qemu-ios-tci-arm64.tar.gz
          if-no-files-found: error
          retention-days: 7

  guest:
    name: Minimal ARM64 Alpine guest
    needs: verify
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300

    env:
      NPM_CONFIG_CACHE: ${{ github.workspace }}/.build/npm-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.build/playwright
      TMPDIR: ${{ github.workspace }}/.build/tmp/
      XDG_CACHE_HOME: ${{ github.workspace }}/.build/xdg-cache
      GUEST_ARTIFACT: ${{ github.workspace }}/.build/runtime/ivscode-alpine-aarch64.tar.zst
      VSCODE_SKIP_BUILD_TSGO: '1'
      VSCODE_SERIALIZE_BUILD_MANGLE: '1'
      VSCODE_MANGLE_WORKERS: '1'

    steps:
      - name: Check out iVSCode
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Keep all mutable build state in the workspace
        run: mkdir -p "$NPM_CONFIG_CACHE" "$PLAYWRIGHT_BROWSERS_PATH" "$TMPDIR" "$XDG_CACHE_HOME" .build/runtime

      - name: Restore the guest image for this source revision
        id: guest-cache
        uses: actions/cache@v4
        with:
          path: .build/runtime/ivscode-alpine-aarch64.tar.zst
          key: ivscode-guest-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - name: Select repository Node.js
        if: steps.guest-cache.outputs.cache-hit != 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install guest and repository build requirements
        if: steps.guest-cache.outputs.cache-hit != 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            e2fsprogs \
            libkrb5-dev \
            libnotify-bin \
            libx11-dev \
            libx11-xcb-dev \
            libxkbfile-dev \
            pkg-config \
            zstd
          npm ci

      - name: Type-check with native TypeScript
        if: steps.guest-cache.outputs.cache-hit != 'true'
        timeout-minutes: 15
        run: >-
          node --max-old-space-size=8192
          node_modules/@typescript/native/bin/tsc
          --project src/tsconfig.json
          --pretty false
          --noEmit

      - name: Compile the mangled server sources
        if: steps.guest-cache.outputs.cache-hit != 'true'
        timeout-minutes: 120
        run: npm run gulp compile-build-with-mangling

      - name: Rebuild native remote dependencies for Alpine
        if: steps.guest-cache.outputs.cache-hit != 'true'
        timeout-minutes: 30
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: sudo --preserve-env=GITHUB_TOKEN,TMPDIR bash ios/Runtime/scripts/rebuild-alpine-remote-dependencies.sh

      - name: Build the minimized REH web server
        if: steps.guest-cache.outputs.cache-hit != 'true'
        timeout-minutes: 75
        shell: bash
        run: |
          set -euo pipefail
          npm run gulp clean-extensions-build
          npm run gulp compile-non-native-extensions-build
          npm run gulp compile-copilot-extension-build
          npm run gulp compile-extension-media-build
          npm run gulp minify-vscode-reh-web
          npm run gulp vscode-reh-web-alpine-arm64-min-ci

      - name: Build the verified Alpine guest image
        if: steps.guest-cache.outputs.cache-hit != 'true'
        shell: bash
        run: |
          set -euo pipefail
          sudo bash ios/Runtime/scripts/build-guest-image.sh \
            --server "$GITHUB_WORKSPACE/../vscode-reh-web-alpine-arm64" \
            --output "$GUEST_ARTIFACT"

      - name: Verify the guest transport artifact
        shell: bash
        run: |
          set -euo pipefail
          test -s "$GUEST_ARTIFACT"
          members="$(tar --zstd -tf "$GUEST_ARTIFACT")"
          for required in vmlinuz-virt initramfs-virt rootfs.ext4 workspace.ext4 packages.txt SHA256SUMS runtime-manifest.json; do
            grep -Eq "^\./${required}$" <<<"$members"
          done
          verification='.build/runtime/guest-verification'
          rm -rf "$verification"
          mkdir -p "$verification"
          tar --zstd -xf "$GUEST_ARTIFACT" -C "$verification"
          (
            cd "$verification"
            sha256sum --check SHA256SUMS
          )
          cmp -s ios/Runtime/manifest.json "$verification/runtime-manifest.json"
          du -sh "$GUEST_ARTIFACT"

      - name: Upload the Alpine guest
        uses: actions/upload-artifact@v4
        with:
          name: ivscode-alpine-aarch64-${{ github.sha }}
          path: .build/runtime/ivscode-alpine-aarch64.tar.zst
          if-no-files-found: error
          retention-days: 7

  full-app:
    name: Full runtime and unsigned iOS app
    needs:
      - engine
      - guest
      - web
    runs-on: macos-26
    timeout-minutes: 90

    env:
      TMPDIR: ${{ github.workspace }}/.build/tmp/
      XDG_CACHE_HOME: ${{ github.workspace }}/.build/xdg-cache

    steps:
      - name: Check out iVSCode
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Keep all mutable build state in the workspace
        run: >-
          mkdir -p
          "$TMPDIR"
          "$XDG_CACHE_HOME"
          .build/runtime/engine
          .build/runtime/engine-transport
          .build/runtime/guest
          .build/workbench
          ios/.build
          ios/iVSCode/Generated/Workbench

      - name: Download the no-JIT engine
        uses: actions/download-artifact@v4
        with:
          name: ivscode-qemu-ios-tci-arm64-${{ github.sha }}
          path: .build/runtime/engine-transport

      - name: Download the Alpine guest
        uses: actions/download-artifact@v4
        with:
          name: ivscode-alpine-aarch64-${{ github.sha }}
          path: .build/runtime/guest

      - name: Download the production workbench
        uses: actions/download-artifact@v4
        with:
          name: ivscode-full-workbench-${{ github.sha }}
          path: .build/workbench

      - name: Expand and stage the verified app payloads
        shell: bash
        run: |
          set -euo pipefail
          command -v zstd >/dev/null 2>&1 || brew install zstd
          tar -xzf .build/runtime/engine-transport/ivscode-qemu-ios-tci-arm64.tar.gz \
            -C .build/runtime/engine
          test -x .build/runtime/engine/Frameworks/qemu-aarch64-softmmu.framework/qemu-aarch64-softmmu
          tar -xf .build/workbench/iVSCode-Workbench.tar -C ios/iVSCode/Generated/Workbench
          bash ios/scripts/stage-runtime.sh \
            --engine "$GITHUB_WORKSPACE/.build/runtime/engine" \
            --guest "$GITHUB_WORKSPACE/.build/runtime/guest/ivscode-alpine-aarch64.tar.zst"

      - name: Select the pinned project generator
        shell: bash
        run: |
          set -euo pipefail
          archive="$GITHUB_WORKSPACE/.build/xcodegen.zip"
          destination="$GITHUB_WORKSPACE/.build/xcodegen"
          curl --fail --location --retry 3 \
            https://github.com/yonaskolb/XcodeGen/releases/download/2.46.0/xcodegen.zip \
            --output "$archive"
          echo '4d9e34b62172d645eed6457cac13fc222569974098ef4ee9c3368bedf0196806  '"$archive" | shasum -a 256 --check
          ditto -x -k "$archive" "$destination"
          echo "$destination/bin" >> "$GITHUB_PATH"

      - name: Generate the Xcode project
        run: |
          xcodebuild -version
          xcodegen --version
          xcodegen generate --spec ios/project.yml

      - name: Build the unsigned full-runtime app
        run: >-
          xcodebuild
          -project ios/iVSCode.xcodeproj
          -scheme iVSCode
          -configuration Release
          -destination 'generic/platform=iOS'
          -derivedDataPath ios/.build/DerivedData-Full
          -clonedSourcePackagesDirPath ios/.build/SourcePackages
          CODE_SIGNING_ALLOWED=NO
          IVSCODE_REQUIRE_RUNTIME=1
          build

      - name: Verify the full-runtime app contract
        shell: bash
        run: |
          set -euo pipefail
          app='ios/.build/DerivedData-Full/Build/Products/Release-iphoneos/iVSCode.app'
          runtime='ios/iVSCode/Generated/Runtime'
          test -d "$app"
          test -f "$app/Workbench/index.html"
          test -f "$app/Workbench/out/vs/workbench/workbench.web.main.internal.js"
          test -f "$app/Guest/vmlinuz-virt"
          test -f "$app/Guest/initramfs-virt"
          test -f "$app/Guest/rootfs.ext4"
          test -f "$app/Guest/workspace.ext4"
          cmp -s ios/Runtime/manifest.json "$app/Guest/runtime-manifest.json"
          (
            cd "$app/Guest"
            shasum -a 256 --check SHA256SUMS
          )
          while IFS= read -r framework; do
            test -n "$framework"
            test -d "$app/Frameworks/$framework"
            find "$app/Frameworks/$framework" -maxdepth 1 -type f -perm -111 \
              -print -quit | grep -q .
          done < "$runtime/frameworks.txt"
          grep '  Frameworks/' "$runtime/SHA256SUMS" | (
            cd "$app"
            shasum -a 256 --check
          )
          qemu="$app/Frameworks/qemu-aarch64-softmmu.framework/qemu-aarch64-softmmu"
          test -x "$qemu"
          exports="$(nm -gjU "$qemu")"
          for symbol in qemu_init qemu_main_loop qemu_cleanup; do
            grep -Eq "^_?${symbol}$" <<<"$exports"
          done
          if find "$app/Frameworks" -type f -perm -111 -print0 | \
            xargs -0 nm -u 2>/dev/null | grep -Eq '[[:space:]]_hv_[[:alnum:]_]*$'; then
            echo 'error: private Hypervisor symbols leaked into the packaged app' >&2
            exit 1
          fi
          plutil -lint "$app/Info.plist"
          du -sh "$app" "$app/Guest" "$app/Frameworks"

      - name: Package an unsigned full-runtime IPA
        shell: bash
        run: |
          set -euo pipefail
          package_root='ios/.build/full-package'
          app='ios/.build/DerivedData-Full/Build/Products/Release-iphoneos/iVSCode.app'
          mkdir -p "$package_root/Payload"
          ditto "$app" "$package_root/Payload/iVSCode.app"
          (
            cd "$package_root"
            /usr/bin/zip -qry ../iVSCode-full-unsigned.ipa Payload
          )
          shasum -a 256 ios/.build/iVSCode-full-unsigned.ipa > ios/.build/iVSCode-full-unsigned.ipa.sha256

      - name: Upload the unsigned full app
        uses: actions/upload-artifact@v4
        with:
          name: iVSCode-full-unsigned-${{ github.sha }}
          path: |
            ios/.build/iVSCode-full-unsigned.ipa
            ios/.build/iVSCode-full-unsigned.ipa.sha256
            ios/iVSCode/Generated/Workbench/ivscode-build.json
            ios/iVSCode/Generated/Runtime/runtime-manifest.json
          if-no-files-found: error
          retention-days: 7
